name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_VERSION: 1.97.1

jobs:
  publish:
    name: Verify and publish crate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate tag and version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$RELEASE_TAG" = "v$version"
          git tag --points-at HEAD | grep -Fxq "$RELEASE_TAG"
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-semver-checks
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-release-semver-0.49.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-release-semver-0.49.0-
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Install cargo-semver-checks
        run: |
          if ! cargo semver-checks --version 2>/dev/null | grep -Fq '0.49.0'; then
            cargo install cargo-semver-checks --locked --version 0.49.0
          fi
      - name: Verify release
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo doc --locked --no-deps --all-features
          cargo semver-checks check-release
          cargo package --locked
          cargo publish --locked --dry-run
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_APIKEY }}
        run: cargo publish --locked
