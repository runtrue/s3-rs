name: AWS compatibility

on:
  schedule:
    # Exercise the same OIDC path used by release tags every day. Scheduled
    # workflows run from the default branch.
    - cron: "17 04 * * *"
  workflow_call:
    inputs:
      aws_region:
        description: AWS region containing the compatibility bucket
        required: false
        default: us-east-1
        type: string
      addressing_style:
        description: S3 addressing style
        required: false
        default: virtual
        type: string
      git_ref:
        description: Exact commit or tag to test
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region containing the compatibility bucket
        required: true
        default: us-east-1
        type: string
      addressing_style:
        description: S3 addressing style
        required: true
        default: virtual
        type: choice
        options:
          - virtual
          - path
      git_ref:
        description: Exact commit or tag to test; defaults to the dispatched ref
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-compat-${{ inputs.git_ref || github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.97.1

jobs:
  aws-compat:
    name: AWS S3 compatibility
    if: github.event_name != 'schedule' || vars.AWS_CONFORMANCE_REQUIRED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: aws-compat
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-aws-compat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-aws-compat-
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Acquire short-lived AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: s3-wire-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region || vars.AWS_COMPAT_REGION || 'us-east-1' }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Run AWS compatibility suite
        env:
          AWS_REGION: ${{ inputs.aws_region || vars.AWS_COMPAT_REGION || 'us-east-1' }}
          S3_WIRE_AWS_ADDRESSING_STYLE: ${{ inputs.addressing_style || 'virtual' }}
          S3_WIRE_AWS_BUCKET: ${{ secrets.S3_WIRE_AWS_BUCKET }}
        run: |
          set +e
          cargo test --locked --features aws-compat --test aws_compat -- --ignored --nocapture
          status=$?
          set -e
          mkdir -p "$RUNNER_TEMP/aws-compat"
          tested_commit=$(git rev-parse HEAD)
          if [ "$status" -eq 0 ]; then result=passed; else result=failed; fi
          printf '{"schema_version":1,"result":"%s","run_id":"%s","commit":"%s"}\n' \
            "$result" "$GITHUB_RUN_ID" "$tested_commit" > "$RUNNER_TEMP/aws-compat/result.json"
          printf '# AWS compatibility\n\n- Result: %s\n- Run: %s\n- Commit: %s\n' \
            "$result" "$GITHUB_RUN_ID" "$tested_commit" > "$RUNNER_TEMP/aws-compat/result.md"
          exit "$status"
      - name: Add compatibility result to summary
        if: always()
        run: test ! -f "$RUNNER_TEMP/aws-compat/result.md" || cat "$RUNNER_TEMP/aws-compat/result.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted compatibility result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-compat-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aws-compat
          if-no-files-found: warn
          retention-days: 14
