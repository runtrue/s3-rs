name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_VERSION: 1.97.1

jobs:
  quality:
    name: Format, lint, and docs (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.97.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned MSRV toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
          rustup default "${{ matrix.rust }}"
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ matrix.rust }}-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.rust }}-quality-
            cargo-${{ runner.os }}-${{ matrix.rust }}-
      - name: Verify toolchain pin
        run: |
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
          test "$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)" = "$RUST_VERSION"
          test "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" = "$RUST_VERSION"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  test:
    name: Test all targets and features
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-test-
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Run test suite
        run: |
          cargo test --locked --all-targets
          cargo test --locked --all-targets --all-features

  auxiliary:
    name: Auxiliary crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/auxiliary
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/auxiliary
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-auxiliary-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-auxiliary-
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Check fuzz targets
        run: cargo check --locked --all-targets --manifest-path fuzz/Cargo.toml
      - name: Check performance harness
        run: cargo check --locked --all-targets --manifest-path tools/perf/Cargo.toml
      - name: Check size comparison crates
        run: |
          cargo check --locked --all-targets --manifest-path comparisons/size/s3-wire/Cargo.toml
          cargo check --locked --all-targets --manifest-path comparisons/size/s3-wire-http2/Cargo.toml
          cargo check --locked --all-targets --manifest-path comparisons/size/rust-s3/Cargo.toml
          cargo check --locked --all-targets --manifest-path comparisons/size/aws-sdk-s3/Cargo.toml

  s3-compat:
    name: ${{ matrix.label }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: minio
            label: MinIO
          - provider: rustfs
            label: RustFS
          - provider: seaweedfs
            label: SeaweedFS
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-s3-${{ matrix.provider }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-s3-${{ matrix.provider }}-
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Run pinned ${{ matrix.provider }} compatibility suite
        env:
          PROVIDER: ${{ matrix.provider }}
          PROVIDER_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p "$RUNNER_TEMP/s3-compat"
          set +e
          ./scripts/test-s3-compat.sh "$PROVIDER"
          status=$?
          set -e
          if test "$status" -eq 0; then result=passed; else result=failed; fi
          jq -n \
            --arg provider "$PROVIDER" \
            --arg result "$result" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            "{schema_version: 1, provider: \$provider, result: \$result,
              commit: \$commit, run_id: \$run_id}" \
            > "$RUNNER_TEMP/s3-compat/result.json"
          {
            printf '# %s compatibility\n\n' "$PROVIDER_LABEL"
            printf -- '- Result: %s\n- Commit: %s\n- Run: %s\n' \
              "$result" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/s3-compat/result.md"
          exit "$status"
      - name: Add provider result to summary
        if: always()
        run: test ! -f "$RUNNER_TEMP/s3-compat/result.md" || cat "$RUNNER_TEMP/s3-compat/result.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted provider report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-compat-${{ matrix.provider }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s3-compat
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package and publish dry-run
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-semver-checks
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-package-semver-0.49.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-package-semver-0.49.0-
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Install semantic-version checker
        run: |
          if ! cargo semver-checks --version 2>/dev/null | grep -Fq '0.49.0'; then
            cargo install cargo-semver-checks --locked --version 0.49.0
          fi
      - name: Build package archive
        run: cargo package --locked
      - name: Check public API compatibility
        run: cargo semver-checks check-release --all-features
      - name: Validate publish without uploading
        run: cargo publish --locked --dry-run
