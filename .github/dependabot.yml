version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
      - /tools/perf
      - /comparisons/size/aws-sdk-s3
      - /comparisons/size/rust-s3
      - /comparisons/size/s3-wire
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
