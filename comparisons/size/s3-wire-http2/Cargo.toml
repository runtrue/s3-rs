[package]
name = "compare-s3-wire-http2"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
s3-wire = { path = "../../..", version = "=0.2.0", default-features = false, features = ["http2"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
