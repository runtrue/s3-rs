[package]
name = "s3-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "An async, streaming S3-compatible client for Rust"
license = "Apache-2.0"
repository = "https://github.com/runtrue/s3-rs"
readme = "README.md"
keywords = ["s3", "storage", "async", "streaming"]
categories = ["api-bindings", "asynchronous", "network-programming"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
bytes = "1.12.1"
fastrand = "2.5.0"
futures-core = "0.3.33"
futures-util = "0.3.33"
hmac = "0.13.0"
http = "1.4.2"
http-body-util = "0.1.3"
httpdate = "1.0.3"
hyper = { version = "1.8.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1.19", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
md-5 = "0.11.0"
pin-project-lite = "0.2.17"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
zeroize = "1.9.0"

[dev-dependencies]
axum = "0.8.9"
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tower = "0.5.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
