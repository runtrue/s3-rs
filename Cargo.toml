[package]
name = "s3-wire"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "An async, streaming S3-compatible client for Rust"
license = "Apache-2.0"
repository = "https://github.com/runtrue/s3-rs"
homepage = "https://github.com/runtrue/s3-rs"
documentation = "https://docs.rs/s3-wire"
readme = "README.md"
keywords = ["s3", "object-storage", "aws", "minio", "sigv4"]
categories = ["api-bindings", "asynchronous", "network-programming"]
include = [
    "/src/**",
    "/benches/**",
    "/comparisons/size/REPORT.md",
    "/comparisons/size/results.json",
    "/docs/**",
    "/examples/**",
    "/measurements/**",
    "/tests/**",
    "/adapters/object-store/README.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/Cargo.toml",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/ROADMAP.md",
    "/README.md",
    "/LICENSE",
    "/deny.toml",
    "/rust-toolchain.toml",
]

[features]
default = []
# Enables HTTP/2 negotiation in addition to the default HTTP/1.1 transport.
http2 = ["hyper/http2", "hyper-rustls/http2", "hyper-util/http2"]
# Narrow, non-production entry points used by cargo-fuzz and benchmarks.
fuzzing = []
aws-compat = []
# Opt-in bridge to AWS's standard profile, web-identity, ECS, and IMDS
# credential and region provider chains. The default build remains independent
# of the AWS SDK runtime.
aws-credentials = ["dep:aws-config", "dep:aws-credential-types"]

[dependencies]
async-trait = "0.1.91"
aws-config = { version = "1.10.0", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio"], optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
base64 = "0.23.1"
bytes = "1.12.1"
fastrand = "2.5.0"
futures-core = "0.3.33"
futures-util = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
hmac = "0.13.0"
http = "1.4.2"
http-body-util = "0.1.3"
httpdate = "1.0.3"
hyper = { version = "1.8.1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1.19", features = ["client", "client-legacy", "http1", "tokio"] }
md-5 = "0.11.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["io"] }
zeroize = "1.9.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bench]]
name = "validation"
harness = false
required-features = ["fuzzing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]
